// Presentation pacing against the real host: beat-per-visible-action, fold rules, hold table.
tasks.register('pacingSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.codex.yugiohmdpro.engine.PacingSmoke'
    workingDir rootProject.projectDir.parentFile
    args rootProject.projectDir.parentFile.absolutePath
}


