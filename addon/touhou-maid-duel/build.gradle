plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.codex'
version = '0.1.5'
base { archivesName = 'touhou-little-maid-yugioh-duel-addon' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
if (project.hasProperty('maidSmoke')) sourceSets.main.java.srcDir 'src/smoke/java'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('../../run-client')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-Xms128m', '-XX:+UseSerialGC', '-XX:ReservedCodeCacheSize=96m'
            args '--mixin', 'touhou_maid_duel.mixins.json'
            mods { touhou_maid_duel { source sourceSets.main } }
        }
        server { workingDirectory project.file('../../run-server') }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs '../../generated/deps', '../build/libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    implementation fg.deobf('local:yugioh:1.0.0')
    implementation fg.deobf('local:yugioh-interaction-fix:0.103.2-mdpro')
    implementation fg.deobf('local:ygostar:1.0.0')
    implementation fg.deobf('local:geckolib:4.8.4')
    implementation fg.deobf('local:touhoulittlemaid:1.5.3')
    compileOnly fg.deobf('local:yugioh-mdpro-api:0.6.28')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    manifest { attributes 'MixinConfigs': 'touhou_maid_duel.mixins.json', 'Implementation-Version': project.version }
}
jar.finalizedBy('reobfJar')
